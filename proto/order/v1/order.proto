syntax = "proto3";

package order.v1;

option go_package = "./order";

import "google/protobuf/timestamp.proto";


service OrderService {

rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);

rpc GetOrder(GetOrderRequest) returns (Order);

rpc WatchOrderStatus(WatchOrderStatusRequest) returns (stream OrderStatusUpdate);

rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

}

message Order {
    string order_id = 1;
    string customer_id = 2;
    repeated OrderItem items = 3;
    OrderStatus status = 4;
    float total_amount = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}

message OrderItem {
    string product_id = 1;
    int32 quantity = 2;
    float unit_price = 3;
}

enum OrderStatus {
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_PENDING = 1;
    ORDER_STATUS_STOCK_RESERVED = 2;
    ORDER_STATUS_PAYMENT_PROCESSING = 3;
    ORDER_STATUS_CONFIRMED = 4;
    ORDER_STATUS_FAILED = 5;
    ORDER_STATUS_CANCELLED = 6;
}
message PlaceOrderRequest {
        string customer_id = 1;
        repeated OrderItem items = 2;
} 

message PlaceOrderResponse {
    string order_id = 1;
    OrderStatus status = 2;
    string failure_reason = 3; // only populated if order status is ORDER_STATUS_FAILED
}

message GetOrderRequest {
string order_id = 1;
}
message WatchOrderStatusRequest {
    string order_id = 1;
}

message OrderStatusUpdate {
    string order_id = 1;
    OrderStatus status = 2;
    google.protobuf.Timestamp updated_at = 3;
    string note = 4;
}
message CancelOrderRequest {
    string order_id = 1;
    string reason = 2;
}

message CancelOrderResponse {
    string order_id = 1;
    OrderStatus status = 2;
}